  utter_election_observers:
    - text: |
        Election observers monitor the fairness and transparency of the voting process. The role of domestic and international observer groups is to: 

        - gather information by directly observing key processes and consulting stakeholders, 
        - draw informed conclusions as shared through statements and reports, and
        - offer recommendations without intervening in the process.
        
        Domestic observation can only be done by citizens of the country that is holding elections.
        International observation can only be done by non-nationals that are invited by the host country to observe elections.
        International election observation can assess whether an election is in line with international standards, highlight specific recommendations for improvement, and demonstrate the support of the international community for genuine democratic elections. Where deserved, international election observation can also promote public confidence in an election. The legal and ethical bases as well as basic methods of international observation are defined in the Declaration of Principles for International Election Observation, developed in a multi-organization process initiated by the United National Electoral Assistance Division, NDI and The Carter Center. 
        Although domestic and international observation are conducted as separate activities, they are complementary - they both aim to assess and improve an election process.


