responses:
  utter_greet:
    - text: "Hey👋! I am CitiBot, a civic educator powered by ChatVE. I’m here to help you understand and navigate important topics about civic life in Nigeria.  

        Whether you’re curious about your rights and responsibilities, how the government is structured, or need guidance on how to vote, I’ve got you covered.  

        We can also dive into the Constitution, explore current civic issues, or even talk about upcoming elections and what they mean for you.  

        Not sure where to start? Just ask me anything, and we’ll take it from there!"

  utter_rights_and_responsibilities:
    - text: "Rights and responsibilities include:\n1. Fundamental Human Rights\n2. Civic Duties\n3. Rights in the Workplace\n4. Children's Rights\n5. Women's Rights"

  utter_fundamental_human_rights:
    - text: |
        Nigerian citizens have the following rights and responsibilities:
        - Fundamental Human Rights
          - Right to Life
          - Right to dignity of human persons
          - Right to personal liberty
          - Right to fair hearing
          - Right to private and family life
          - Right to freedom of thought, conscience and religion
          - Right to freedom of expression and the press
          - Right to peaceful assembly and association
          - Right to freedom of movement
          - Right to freedom from discrimination
          - Right to acquire and own immovable property

  utter_civic_duties:
    - text: |
        Legal Duties of a Citizen Under the Nigerian Constitution include:
        - Obedience to Law
        - Respect for National Symbols
        - Payment of Taxes
        - Voting in Elections
        - Defending the Country
        - Respect for the Rights of Others
        - Service to the Community
        - Upholding the Constitution
        - Respect for Judicial Decisions
        - Environmental Protection
        - Proper Use of Public Property
        - Promotion of National Unity
        - Reporting Crimes
        - Participation in Community Development
        - Respect for Authority
        - Avoidance of Corruption
        - Participation in Census
        - Child Education
        - Promotion of Peace
        - Respect for Cultural Diversity

  utter_rights_in_the_workplace:
    - text: |
        Rights in the workplace include:
        - Right to receive a payslip
        - Right not be discriminated against
        - Right to healthy and safe work environment
        - Right to statutory sick pay
        - Right to statutory maternity and paternity leave
        - Right to request flexible working
        - Right to take time off for annual leave
        - Right to minimum notice periods
        - Right to statutory redundancy pay
        - Right to protection against unfair dismissal

  utter_children_rights:
    - text: |
        The rights of children include:
        - Right to protection
        - Right to education
        - Right to health care
        - Right to shelter
        - Right to good nutrition

  utter_women_rights:
    - text: |
        Women’s rights are fundamental human rights that were enshrined by the United Nations for every human being on the planet. They include:
        - Right to live free from violence, slavery, discrimination
        - Right to education
        - Right to health
        - Right to own property
        - Right to political participation
        - Right to dignity
        - Right to earn fair and equal wage

  utter_government_structure:
    - text: "The government structure includes:\n1. Federal Government\n2. State Government\n3. Local Government\n4. Federal vs. State Government."

  utter_federal_government:
    - text: |
        Federal Government:

        The federal government of Nigeria is composed of three distinct branches: the executive, the legislative, and the judicial, whose powers are vested and bestowed upon by the Constitution of the Federal Republic of Nigeria.
        The Executive: The executive tier of government is one of the three branches of government, responsible for implementing and enforcing laws and policies.
        The President of Nigeria heads the executive branch at the national level. The President is supported by the Vice President, ministers, and various government agencies and departments. 
        The Legislature: Nigeria operates a Bi-cameral legislature made up of two Independent Chambers; the Senate and the House of Representatives. The Senate, referred to as the Red Chamber, comprises 109 Senators representing three Senatorial Districts of each of the 36 States of the Federation. It is led by the Senate President and his Deputy (President of the Senate and Deputy President of the Senate) as well as eight Principal Officers namely Senate Leader and his Deputy, Minority Leader and his Deputy, Chief Whip and his Deputy, Minority Whip and his Deputy. 
        The House of Representatives also known as the Green Chamber is made up of 360 Federal Representatives. Each Member represents one Federal Constituency of Nigeria. The Green Chamber is led by the Speaker and assisted by the Deputy Speaker along with eight Principal Officers that include Majority Leader, Deputy Majority Leader, Minority Leader, Deputy Minority Leader, Chief Whip, Deputy Chief Whip, Minority Whip and Deputy Minority Whip. 
        The Judiciary: The Supreme Court of Nigeria (SCN) is the highest court in Nigeria. The Supreme Court is composed of the Chief Justice of Nigeria and not more than 21 justices.
        An appellate court, commonly called a court of appeal(s), appeal court, court of second instance or second instance court, is any court of law that is empowered to hear a case upon appeal from a trial court or other lower tribunal. 
        The Federal High Court of Nigeria (FHC) is one the Federal superior Courts of record in Nigeria. The Federal High Court is composed of the Chief Judge and judges as may be prescribed by an Act of the National Assembly.

  utter_state_government:
    - text: |
        State Government:

        Nigeria is a federation of 36 states, each of which is a semi-autonomous political unit that shares powers with the federal government as enumerated under the Constitution of the Federal Republic of Nigeria. In addition to the states, there is the Federal Capital Territory (FCT), in which the capital city of Abuja is located.
        The FCT is not a state, but a territory of the federal government, governed by an administration headed by a minister. Each state is subdivided into local government areas (LGAs). 
        The Executive Arm of the State Government is led by the governor, who is elected to a maximum of two four-year terms. We also have the Deputy Governor, commissioners and other officials of the state executive council,
        The Legislative Arm of the Government at the State level is called the House of Assembly. This arm of government is primarily responsible for developing laws focused on the progress and well being of the State. The people elect members of the House of Assembly and they represent their State Constituencies at the State.
        The State Judiciary is usually led by the Chief Justice of the State, who presides over other Justices of the state High court. Court structures and judicial appointments are at the discretion of the Governor subject to the recommendation for appointment by National Judicial Council and confirmation by the State House of Assembly.

  utter_local_government:
    - text: |
        Local Government: 

        LGA stands for Local Government Area. Nigeria has a total of 774 Local Government Areas (LGAs). LGAs are administrative divisions that serve as the third tier of government, below the state and federal levels. 
        They are responsible for local administration and governance, providing basic services, and implementing government policies at the grassroots level. Each LGA is governed by a local government council, which is headed by an elected chairman. 
        Councillors are elected representatives from ward level who serve on the local government councils within the Local Government Areas (LGAs) in Nigeria. A ward is an administrative division within a Local Government Area (LGA) in Nigeria. 
        It serves as the smallest electoral unit and is used for organising elections and local governance.

  utter_federal_vs_state_government:
    - text: "The Federal Government manages national issues, while State Governments focus on regional concerns."

  utter_how_to_vote:
    - text: "Voting involves:\n1. Voter Registration\n2. Voter's Card\n3. Voting Process\n4. What to Do if You Encounter Issues\n5. Absentee Voting."

  utter_voter_registration:
    - text: |
        Voter Registration: 

        Voter registration involves visiting the electoral commission office or registering online where available.
        To register to vote in Nigeria, you need to follow these steps:
        Eligibility: Ensure you meet the eligibility criteria. You must be a Nigerian citizen, at least 18 years old, and possess a valid means of identification.
        Visit INEC Office: Go to the nearest Independent National Electoral Commission (INEC) office or designated registration centre during the Continuous Voter Registration (CVR) period.
        Provide Identification: Present a valid form of identification, such as a National Identity Card, International Passport, Driver's License, or any other recognized ID.
        Biometric Capture: Your biometric data, including fingerprints and photograph, will be captured during the registration process.
        Receive Temporary Voter’s Card (TVC): After registration, you will be issued a Temporary Voter’s Card (TVC).
        Collect Permanent Voters Card (PVC): Once your registration is processed, you will be notified to collect your Permanent Voter’s Card (PVC) at the INEC office or designated collection centre.
        
        For more information and updates on voter registration, you can visit the INEC website or contact their offices.

  utter_voters_card:
    - text: |
        Voter’s Card: 
        The permanent voter’s card (PVC) is obtainable from INEC. This card is essential as it serves as proof of your eligibility to vote.

  utter_voting_process:
    - text: |
        Voting Process:
    
        Locate Your Polling Unit: Before the election day, find out the location of your designated polling unit. This information is usually available on your PVC or can be checked on the INEC website.
        
        Election Day:
        
          Arrival: On election day, arrive at your polling unit early. Polling units typically open at 8:00 AM.
          Accreditation: Present your PVC to the electoral officials for accreditation. This process may involve biometric verification.
          Voting: Once accredited, you will receive a ballot paper. Proceed to the voting booth to mark your choice secretly.
          Ballot Box: After marking your ballot, fold it and place it in the designated ballot box.
          Follow Instructions: Ensure you follow all instructions provided by the electoral officials to avoid your vote being invalidated.
          Observe: You may stay to observe the counting process if you wish, but ensure you do so peacefully and without causing any disruptions.The voting process involves presenting your voter's card, marking your choice, and submitting your ballot."

  utter_voting_issues:
    - text: "If you encounter issues while voting, report to the nearest election official immediately."

  utter_absentee_voting:
    - text: "Absentee voting allows eligible voters to cast their votes by mail if they are unable to be present in person."

  utter_understanding_constitution:
    - text: "Understanding the Constitution includes:\n1. Introduction to the Nigerian Constitution\n2. Amendments to the Constitution\n3. Rights Protected by the Constitution\n4. Separation of Powers."

  utter_constitution_introduction:
    - text: |
        Introduction to the Nigerian Constitution:

        The Constitution is supreme and its provisions  have a binding force on the authorities and persons throughout the Federal Republic of Nigeria. Nigeria has had many constitutions.
        The 1999 constitution identifies the national capital, 36 states and their capitals, and 774 local government areas within Nigeria. It establishes the legislative, executive, and judicial branches of government and details their duties and the separation of powers between the branches and federal and state governments. 
        In addition, the Constitution outlines the individual's fundamental rights including a person's right to timely and fair trial if arrested and the presumption of innocence.
        The constitution also protects four laws: the Land Use Act, the National Securities Agencies Act, the National Youth Service legislation, and the Public Complaints Commission Act.

  utter_constitution_amendments:
    - text: "Amendments to the Constitution are changes made to adapt it to evolving legal and social conditions."

  utter_constitution_rights:
    - text: |
        The Constitution protects fundamental rights like freedom of speech and religion. Click on the link below to get more information:
        http://www.nigeria-law.org/ConstitutionOfTheFederalRepublicOfNigeria.htm

  utter_separation_of_powers:
    - text: |
        Separation of Powers:

        The separation of powers ensures that the legislative, executive, and judicial branches operate independently to prevent abuse of power.
        It is a hallowed constitutional principle of the democratic government of Nigeria for the three arms of government to stay in their assigned tracks to avoid arbitrary excesses by any of the arms. 
        The legislature makes the law; the executive executes the law, while the judiciary interprets the law.

