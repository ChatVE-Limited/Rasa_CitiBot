version: "3.1"

rules:
  - rule: Greeting
    steps:
      - intent: greet
      - action: utter_greet

  # Rights and Responsibilities
  - rule: Provide information about Rights and Responsibilities
    steps:
      - intent: ask_rights_and_responsibilities
      - action: utter_rights_and_responsibilities

  - rule: Provide information about Fundamental Human Rights
    steps:
      - intent: ask_fundamental_human_rights
      - action: utter_fundamental_human_rights

  - rule: Provide information about Civic Duties
    steps:
      - intent: ask_civic_duties
      - action: utter_civic_duties

  - rule: Provide information about Rights in the Workplace
    steps:
      - intent: ask_rights_in_the_workplace
      - action: utter_rights_in_the_workplace

  - rule: Provide information about Children's Rights
    steps:
      - intent: ask_children_rights
      - action: utter_children_rights

  - rule: Provide information about Women's Rights
    steps:
      - intent: ask_women_rights
      - action: utter_women_rights

  # Government Structure
  - rule: Provide information about Government Structure
    steps:
      - intent: ask_government_structure
      - action: utter_government_structure

  - rule: Provide information about the Federal Government
    steps:
      - intent: ask_federal_government
      - action: utter_federal_government

  - rule: Provide information about the State Government
    steps:
      - intent: ask_state_government
      - action: utter_state_government

  - rule: Provide information about the Local Government
    steps:
      - intent: ask_local_government
      - action: utter_local_government

  - rule: Provide information about Federal vs. State Government
    steps:
      - intent: ask_federal_vs_state_government
      - action: utter_federal_vs_state_government

  # How to Vote
  - rule: Provide information about How to Vote
    steps:
      - intent: ask_how_to_vote
      - action: utter_how_to_vote

  - rule: Provide information on Voter Registration
    steps:
      - intent: ask_voter_registration
      - action: utter_voter_registration

  - rule: Provide information on Voter’s Card
    steps:
      - intent: ask_voters_card
      - action: utter_voters_card

  - rule: Provide information on the Voting Process
    steps:
      - intent: ask_voting_process
      - action: utter_voting_process

  - rule: Provide information on Voting Issues
    steps:
      - intent: ask_voting_issues
      - action: utter_voting_issues

  - rule: Provide information on Absentee Voting
    steps:
      - intent: ask_absentee_voting
      - action: utter_absentee_voting

  # Understanding the Constitution
  - rule: Provide information about Understanding the Constitution
    steps:
      - intent: ask_understanding_constitution
      - action: utter_understanding_constitution

  - rule: Provide an Introduction to the Nigerian Constitution
    steps:
      - intent: ask_constitution_introduction
      - action: utter_constitution_introduction

  - rule: Provide information about Amendments to the Constitution
    steps:
      - intent: ask_constitution_amendments
      - action: utter_constitution_amendments

  - rule: Provide information about Rights Protected by the Constitution
    steps:
      - intent: ask_constitution_rights
      - action: utter_constitution_rights

  - rule: Provide information about the Separation of Powers
    steps:
      - intent: ask_separation_of_powers
      - action: utter_separation_of_powers

  # Current Civic Issues
  - rule: Provide information about Current Civic Issues
    steps:
      - intent: ask_current_civic_issues
      - action: utter_current_civic_issues

  - rule: Provide information about Electoral Reforms
    steps:
      - intent: ask_electoral_reforms
      - action: utter_electoral_reforms

  - rule: Provide information about Anti-Corruption Efforts
    steps:
      - intent: ask_anti_corruption_efforts
      - action: utter_anti_corruption_efforts

  - rule: Provide information about Security Concerns
    steps:
      - intent: ask_security_concerns
      - action: utter_security_concerns

  - rule: Provide information about Economic Policies
    steps:
      - intent: ask_economic_policies
      - action: utter_economic_policies

  - rule: Provide information about Human Rights Issues
    steps:
      - intent: ask_human_rights_issues
      - action: utter_human_rights_issues

  # Glossary of Civic Terms
  - rule: Provide the Glossary of Civic Terms
    steps:
      - intent: ask_glossary_of_civic_terms
      - action: utter_glossary_of_civic_terms

  # Upcoming Elections
  - rule: Provide the Election Calendar
    steps:
      - intent: ask_election_calendar
      - action: utter_election_calendar

  - rule: Provide information on How to Check Voter Registration Status
    steps:
      - intent: ask_registration_status
      - action: utter_registration_status

  - rule: Provide information about Candidates and Parties
    steps:
      - intent: ask_candidates_and_parties
      - action: utter_candidates_and_parties

  - rule: Provide information about Election Observers
    steps:
      - intent: ask_election_observers
      - action: utter_election_observers

  - rule: Fallback to GPT for unknown questions
    steps:
      - intent: nlu_fallback
      - action: action_default_gpt_response

  - rule: GoodBye
    steps:
      - intent: goodbye
      - action: utter_goodbye
