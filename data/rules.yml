version: "3.1"

rules:
  - rule: Greeting
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Handle general questions with GPT
    steps:
      - intent: gpt_response
      - action: action_default_gpt_response

  - rule: GoodBye
    steps:
      - intent: goodbye
      - action: utter_goodbye
