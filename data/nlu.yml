version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hey
      - hello
      - hi
      - hello there
      - good morning
      - good evening
      - moin
      - hey there
      - let's go
      - hey dude
      - aw are you
      - goodmorning
      - goodevening
      - good afternoon

  - intent: goodbye
    examples: |
      - cu
      - good by
      - cee you later
      - good night
      - bye
      - goodbye
      - have a nice day
      - see you around
      - bye bye
      - see you later

    ## Rights and Responsibilities
  - intent: ask_rights_and_responsibilities
    examples: |
      - Tell me about rights and responsibilities.
      - What are my rights and responsibilities?
      - Explain rights and responsibilities.
      - I want to know about rights and responsibilities.

  - intent: ask_fundamental_human_rights
    examples: |
      - Tell me about fundamental human rights
      - What are fundamental human rights?
      - Can you explain basic human rights?
      - I want to learn about my rights as a human
      - What are my fundamental rights?

  - intent: ask_civic_duties
    examples: |
      - What are civic duties?
      - Can you explain my duties as a citizen?
      - Tell me about civic responsibilities
      - What responsibilities do I have as a citizen?

  - intent: ask_rights_in_the_workplace
    examples: |
      - What are my rights at work?
      - Tell me about workplace rights
      - What should I know about employee rights?
      - Can you explain workplace policies?

  - intent: ask_children_rights
    examples: |
      - What are children’s rights?
      - Can you explain children’s rights?
      - Tell me about rights for children
      - What rights do children have?

  - intent: ask_women_rights
    examples: |
      - What are women’s rights?
      - Can you explain women’s rights?
      - Tell me about women’s rights
      - What rights do women have?

    ## Government Structure
  - intent: ask_government_structure
    examples: |
      - Tell me about the government structure.
      - What is the structure of the government?
      - I want to know about government structure.
      - Explain government structure.

  - intent: ask_federal_government
    examples: |
      - What is the federal government?
      - Explain the federal government system
      - How does the federal government work?

  - intent: ask_state_government
    examples: |
      - What is the state government?
      - Tell me about state government
      - Can you explain the role of state government?

  - intent: ask_local_government
    examples: |
      - What is the local government?
      - Tell me about local government responsibilities
      - Can you explain local governance?

  - intent: ask_federal_vs_state_government
    examples: |
      - What is the difference between federal and state government?
      - Federal vs. state government: what's the difference?
      - How do the federal and state governments compare?

  ## How to Vote
  - intent: ask_how_to_vote
    examples: |
      - How do I vote?
      - Tell me how to vote.
      - I need information on how to vote.
      - Explain the process of voting.

  - intent: ask_voter_registration
    examples: |
      - How do I register to vote?
      - Tell me about voter registration
      - How can I get my name on the voter list?

  - intent: ask_voters_card
    examples: |
      - What is a voter’s card?
      - How do I get a voter’s card?
      - Tell me about the voter’s card

  - intent: ask_voting_process
    examples: |
      - How does the voting process work?
      - What is the procedure for voting?
      - Can you explain the voting process?

  - intent: ask_voting_issues
    examples: |
      - What do I do if I encounter issues while voting?
      - How do I handle voting problems?
      - Tell me about solving voting issues

  - intent: ask_absentee_voting
    examples: |
      - How does absentee voting work?
      - Can I vote if I’m not physically present?
      - Tell me about absentee voting

  ## Understanding the Constitution
  - intent: ask_understanding_constitution
    examples: |
      - I want to understand the Constitution.
      - Tell me about the Constitution.
      - Can you explain the Constitution?
      - I need information about the Constitution.

  - intent: ask_constitution_introduction
    examples: |
      - What is the constitution?
      - Can you explain the constitution?
      - Tell me about the introduction to the constitution

  - intent: ask_constitution_amendments
    examples: |
      - What are amendments to the constitution?
      - Can the constitution be changed?
      - Tell me about constitutional amendments

  - intent: ask_constitution_rights
    examples: |
      - What rights are protected by the constitution?
      - Tell me about constitutional rights
      - What does the constitution protect?

  - intent: ask_separation_of_powers
    examples: |
      - What is the separation of powers?
      - Can you explain the separation of powers in government?
      - Tell me about powers divided by the constitution

  ## Current Civic Issues
  - intent: ask_current_civic_issues
    examples: |
      - Tell me about current civic issues.
      - What are the current civic issues?
      - I want to know about civic issues.
      - Explain current civic issues.

  - intent: ask_electoral_reforms
    examples: |
      - What are electoral reforms?
      - Can you explain changes in the election system?
      - Tell me about reforms in voting laws

  - intent: ask_anti_corruption_efforts
    examples: |
      - What are anti-corruption efforts?
      - Tell me about fighting corruption
      - How is corruption being addressed?

  - intent: ask_security_concerns
    examples: |
      - What are the major security concerns?
      - Tell me about security issues
      - Can you explain safety concerns in the country?

  - intent: ask_economic_policies
    examples: |
      - What are the current economic policies?
      - Can you explain the government’s economic policies?
      - Tell me about the economy’s direction

  - intent: ask_human_rights_issues
    examples: |
      - What are current human rights issues?
      - Tell me about violations of human rights
      - Can you explain ongoing human rights concerns?

  ## Glossary of Civic Terms
  - intent: ask_glossary_of_civic_terms
    examples: |
      - Do you have a glossary of civic terms?
      - Tell me about civic terms.
      - Explain glossary of civic terms.
      - I need information on civic terms.

  ## Upcoming Elections
  - intent: ask_upcoming_elections
    examples: |
      - Tell me about upcoming elections.
      - What are the upcoming elections?
      - I want to know about upcoming elections.
      - Explain upcoming elections.

  - intent: ask_election_calendar
    examples: |
      - When are the upcoming elections?
      - Tell me about the election calendar
      - What is the election schedule?

  - intent: ask_registration_status
    examples: |
      - How do I check my voter registration status?
      - Tell me how to verify my registration
      - Can I check if I’m registered to vote?

  - intent: ask_candidates_and_parties
    examples: |
      - Who are the candidates in the election?
      - Tell me about the political parties
      - Can you explain the parties and candidates?

  - intent: ask_election_observers
    examples: |
      - What are election observers?
      - Can you explain the role of election observers?
      - Tell me about monitoring the elections

  - intent: nlu_fallback
    examples: |
      - [any query Rasa might not predict]

