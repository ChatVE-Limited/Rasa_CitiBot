version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hey
      - hello
      - hi
      - good morning
      - good evening
      - good afternoon

  - intent: gpt_response
    examples: |
      - fundamental human rights
      - civic responsibilities
      - Can you explain children’s rights?
      - What is the structure of the government?
      - voting
      - elections
      - How is corruption being addressed?
      - glossary of civic terms?

  - intent: goodbye
    examples: |
      - bye
      - goodbye
      - bye bye
      - see you later
      - good night



